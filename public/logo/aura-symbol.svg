<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Minimalist Architectural A Symbol -->
  <!-- Left Leg -->
  <path d="M 50 12 L 20 86" stroke="#4A3323" stroke-width="4.5" stroke-linecap="round" />
  <!-- Right Leg -->
  <path d="M 50 12 L 80 86" stroke="#4A3323" stroke-width="4.5" stroke-linecap="round" />
  <!-- Apex Peak Accent -->
  <circle cx="50" cy="12" r="3.2" fill="#B58A52" />
  <!-- Architectural Crossbar with Gold Accent -->
  <line x1="32" y1="58" x2="68" y2="58" stroke="#B58A52" stroke-width="3" stroke-linecap="round" />
  <!-- Inner Floating Geometric Diamond / Accent -->
  <polygon points="50,42 56,52 50,62 44,52" fill="#B58A52" opacity="0.9" />
  <!-- Base Ground Line -->
  <line x1="16" y1="88" x2="84" y2="88" stroke="#4A3323" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 3" opacity="0.4" />
</svg>